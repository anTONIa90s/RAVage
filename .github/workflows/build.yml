# builds standalone binaries for windows, macos (intel + arm) and linux.
#
# pyinstaller cannot cross-compile, so each os/arch builds its own copy on
# its own runner. every run uploads the binaries as artifacts; pushing a tag
# (v*) additionally attaches them to a GitHub release.
#
# on windows the gui becomes ravage.exe (no console window), the cli
# becomes ravage-cli.exe. on macos the gui becomes ravage.app. on linux
# both are plain binaries.

name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: ravage-windows
          - os: ubuntu-latest
            artifact: ravage-linux
          - os: macos-13
            artifact: ravage-macos-x86_64
            arch: x86_64
          - os: macos-latest
            artifact: ravage-macos-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install build deps
        run: pip install -r requirements-build.txt

      - name: Build
        run: pyinstaller --noconfirm --clean ravage.spec

      - name: Package binaries
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path ravage.exe, ravage-cli.exe -DestinationPath ravage-windows.zip -Force"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ARCH="${{ matrix.arch }}"
            DMG_NAME="ravage-macos-${ARCH}.dmg"
            TAR_NAME="ravage-macos-${ARCH}.tar.gz"
            # build a real .dmg
            mkdir -p dmg-staging
            cp -R ravage.app dmg-staging/
            cp ravage-cli dmg-staging/
            echo "Drag ravage.app to Applications. ravage-cli is the command-line tool." > dmg-staging/README.txt
            hdiutil create -volname "RAVage (${ARCH})" -srcfolder dmg-staging -ov -format UDZO "$DMG_NAME"
            # keep tar.gz as well for power users / backwards compat
            tar -czf "$TAR_NAME" -C dmg-staging ravage.app ravage-cli
            rm -rf dmg-staging
          else
            tar -czf ravage-linux.tar.gz ravage ravage-cli
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/ravage-*
            dist/*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ravage-windows.zip
            dist/ravage-macos-x86_64.dmg
            dist/ravage-macos-x86_64.tar.gz
            dist/ravage-macos-arm64.dmg
            dist/ravage-macos-arm64.tar.gz
            dist/ravage-linux.tar.gz
